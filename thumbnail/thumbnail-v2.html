<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#ece8e1}
img{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.fade{position:absolute;left:0;right:0;bottom:0;height:900px;
  background:linear-gradient(180deg,rgba(236,232,225,0) 0%,rgba(236,232,225,.88) 38%,rgba(236,232,225,.96) 100%)}
.title{position:absolute;left:0;right:0;bottom:400px;text-align:center;white-space:nowrap;
  font-family:"Inter Display","Inter",sans-serif;font-weight:900;text-transform:uppercase;
  color:#1d1d1f;line-height:.95;letter-spacing:-2px}
.l1{font-size:128px}
.l2{font-size:112px;margin-top:10px}
.l2 span{color:#e3262b}
.under{display:block;width:620px;height:14px;margin:22px auto 0;background:#e3262b;border-radius:7px;transform:rotate(-1.5deg)}
</style></head>
<body>
<img src="source-illustration.png">
<div class="fade"></div>
<div class="title">
  <div class="l1">Why Always</div>
  <div class="l2">On Your <span>Phone</span></div>
  <i class="under"></i>
</div>
</body></html>
